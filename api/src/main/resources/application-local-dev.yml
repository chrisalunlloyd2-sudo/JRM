spring:
  datasource:
    url: jdbc:h2:mem:chronos;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false # Disable Flyway for H2 in-memory to simplify boot
  data:
    redis:
      repositories:
        enabled: false # Disable Redis for local-dev

chronos:
  jwtSecret: VipersStabilitySecretKey2026Normalcy
  jwtExpirationMs: 86400000 # 24 hours
